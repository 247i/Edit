<!---
	Filename		  : VBS.proto - Prototypes for VBS PSPad scripts

	Created			  : 07 April 2010 (17:00:56)
	Created by		: Russ Williams

	Comments	  	: Keywords must be preceded by ":".
	                Entries are (mostly) sorted only to make them easy to correct.
                  Proto does not depend on the sort.
                  Keywords are capitalized for user convenience. Proto will capitalize
                  whatever you give before searching for a match.
                  Hyphenated keywords have had their hyphens removed because "ecselwordleft"
                  treats hyphens as word breaks.
--->
