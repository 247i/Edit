:ARGINSTR Arg [ template ] [, [ template ] ... ] /* Equivalent to Parse Upper Arg ... */
:CALLINSTR Call routine [ parameter ] [, [ parameter ] ... ] ;
                      { ON | OFF } condition [ NAME label ] ; 
:DOENDINSTR Do [ repetitor ] [ conditional ] ;
    [ clauses ]
  END [ symbol ] ;
   repetitor : = symbol = expri [ TO exprt ]
   [ BY exprb ] [ FOR exprf ]
  exprr
  FOREVER
  conditional : = WHILE exprw
  UNTIL expru
:DROPINSTR Drop symbol [ symbol ... ] ;
:EXITINSTR Exit [ expr ] ;
:IFTHENELSEINSTR If expr [;] THEN [;] statement
  [ ELSE [;] statement ]
:INTERPRETINSTR Interpret expr ;
:ITERATEINSTR Iterate [ symbol ] ;
:LEAVEINSTR Leave [ symbol ] ;
:NOPINSTR Nop ;
:NUMERICINSTR Numeric DIGITS [ expr ] ;
  FORM [ SCIENTIFIC | ENGINEERING | [ VALUE ] expr ] ;
  FUZZ [ expr ] ;
:OPTIONSINSTR Options expr ;
:PARSEINSTR Parse [ option ] [ CASELESS ] type [ template ] ;
  option = { UPPER | LOWER }
  type = { ARG | LINEIN | PULL | SOURCE | VERSION | VALUE [
  expr ] WITH | VAR symbol }
:PROCEDURE Procedure [ EXPOSE [ varref [ varref ... ] ] ] ;
  varref = { symbol | ( symbol ) }
:PULLINSTR Pull [ template ] ;
:PUSHINSTR Push [ expr ] ;
:QUEUEINSTR Queue [ expr ] ;
:RETURNINSTR Return [ expr ] ;
:SAYINSTR Say [ expr ] ;
:SELECTWHENOTHERWISEINSTR Select ; whenpart [ whenpart ... ] [ OTHERWISE [;]
  [ statement ... ] ] END ;
  whenpart : WHEN expr [;] THEN [;] statement
